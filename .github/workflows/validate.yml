name: Validate plugin marketplace

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Weekly run on the pinned CLIs catches host-side format changes early.
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: plugin-marketplace-${{ github.ref }}
  cancel-in-progress: true

env:
  CLAUDE_CODE_VERSION: "2.1.287"
  CODEX_VERSION: "0.159.2"

jobs:
  # The ruleset on main requires this job name. Do not rename it.
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Install the host CLIs used as validators
        run: npm install --global --no-fund --no-audit "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" "@openai/codex@${CODEX_VERSION}"

      - name: Generator rules (both targets, committed root output)
        run: node scripts/sync.mjs check

      - name: Version must grow when the published plugin changes
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/sync.mjs version-rule --base "origin/${BASE_REF}"

      - name: Build both marketplaces
        run: |
          node scripts/sync.mjs build --target dev --out "$RUNNER_TEMP/dev"
          node scripts/sync.mjs build --target prod --out "$RUNNER_TEMP/prod"

      - name: Install into Claude Code and Codex (DEV build)
        run: scripts/smoke-hosts.sh "$RUNNER_TEMP/dev" dev

      - name: Install into Claude Code and Codex (production build)
        run: scripts/smoke-hosts.sh "$RUNNER_TEMP/prod" prod

      - name: MCP Registry entry is valid
        run: |
          scripts/install-mcp-publisher.sh "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/mcp-publisher" validate

      - name: Live OAuth metadata (DEV and production)
        run: |
          scripts/check-oauth.sh dev
          scripts/check-oauth.sh prod
